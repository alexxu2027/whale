[project]
name = "whale-backend"
version = "0.1.0"
description = "Whale game server: matching engine, game logic, multiplayer"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["whale"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "hypothesis>=6.168.5",
    "pytest>=9.1.1",
]
