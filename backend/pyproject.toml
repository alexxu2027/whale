[project]
name = "whale-backend"
version = "0.1.0"
description = "Whale game server: matching engine, game logic, multiplayer"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.4",
    "numpy>=2.5.3",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["whale"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.168.5",
    "pytest>=9.1.1",
]
